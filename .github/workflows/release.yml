name: release

# Publishes to npm when a version tag is pushed: git tag v0.2.0 && git push origin v0.2.0
#
# Auth: npm trusted publishing (OIDC) once it is configured on npmjs.com for
# this repo and workflow, so no token lives here. Until then, and for the very
# first publish (npm only lets you configure a trusted publisher for a package
# that already exists), the NPM_TOKEN repo secret is used instead.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      # `prepare` builds dist/ as part of publish.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
