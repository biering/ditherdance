name: release

# On every push to main, release-please opens or updates a release PR that
# bumps package.json and CHANGELOG.md from the conventional commits since the
# last release. Merging that PR tags the release, creates the GitHub release
# and stages it on npm, all in this one run: a tag pushed with GITHUB_TOKEN
# does not start other workflows. A maintainer then approves the staged version
# with 2FA on npmjs.com or with `npm stage approve` before it goes live.
#
# Auth: npm trusted publishing (OIDC), configured on npmjs.com for this repo
# and this workflow file (release.yml), limited to `npm stage publish`. No
# token lives here.

on:
  push:
    branches: [main]

permissions:
  contents: write # tags, releases, the release branch
  pull-requests: write # the release PR
  id-token: write # trusted publishing and provenance

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@^11.15.0 # `npm stage` needs 11.15
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm stage publish --provenance --access public
